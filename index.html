(function () {

      firebase.initializeApp(firebaseConfig);

      window.dtFirebaseEnabled = true;

      // Same get/set(key, value) shape the app already expects — swaps in
      // transparently, no changes needed anywhere else in the app.
      window.storage = {
        get: function (key) {
          return db.collection("appdata").doc(key).get().then(function (snap) {
            if (!snap.exists) return null;
            return { key: key, value: JSON.stringify(snap.data().value) };
          });
        },
        set: function (key, value) {
          return db.collection("appdata").doc(key).set({ value: JSON.parse(value) }).then(function () {
            return { key: key, value: value };
          });
        },
      };
    } catch (err) {
      console.error("Firebase init failed, falling back to local storage:", err);
      window.dtFirebaseEnabled = false;
    }
  }

  if (!window.dtFirebaseEnabled) {
    // Fallback: same interface, backed by this browser's localStorage.
    window.storage = {
      get: function (key) {
        return Promise.resolve().then(function () {
          var v = localStorage.getItem("dt_" + key);
          return v === null ? null : { key: key, value: v };
        });
      },
      set: function (key, value) {
        return Promise.resolve().then(function () {
          localStorage.setItem("dt_" + key, value);
          return { key: key, value: value };
        });
      },
    };
  }
})();

let deskSeq = 1;
function makeDesk(site, num, x, y) {
  const roll = Math.random();
  const noMonitor = roll < 0.08;
  const occupied = !noMonitor && roll < 0.62;
  return {
    id: `${site.slice(0, 3).toUpperCase()}-${String(num).padStart(3, "0")}-${deskSeq++}`,
    site, number: num,
    x: x ?? 40, y: y ?? 40, rot: 0,
    user: occupied ? SAMPLE_NAMES[Math.floor(Math.random() * SAMPLE_NAMES.length)] : null,
    status: noMonitor ? "unavailable" : occupied ? "occupied" : "available",
    equipment: {
      monitors: noMonitor ? 0 : 2,
      dock: !noMonitor, dockModel: "",
      keyboard: !noMonitor, keyboardModel: "",
      mouse: !noMonitor, mouseModel: "",
      headset: Math.random() > 0.5, headsetModel: "",
      laptop: site === "dubai" && Math.random() > 0.7, laptopModel: "",
    },
    history: [{ ts: Date.now(), action: "Seeded", by: "System" }],
  };
}

function seedDubai() {
  const desks = []; let n = 1;
  const padX = 8, padY = 8, deskW = 26, deskH = 30;
  DUBAI_DESK_ZONES.forEach((z) => {
    const cellW = (z.w - padX * 2) / z.cols;
    const cellH = (z.h - padY * 2) / z.rows;
    for (let r = 0; r < z.rows; r++) {
      for (let c = 0; c < z.cols; c++) {
        const dx = Math.round(z.x + padX + c * cellW + (cellW - deskW) / 2);
        const dy = Math.round(z.y + padY + r * cellH + (cellH - deskH) / 2);
        desks.push(makeDesk("dubai", n++, dx, dy));
      }
    }
  });
  return desks;
}

function genericSpots(count) {
  const positions = []; const perRow = 8, gapX = 46, gapY = 52, sX = 30, sY = 30;
  for (let i = 0; i < count; i++) positions.push({ x: sX + (i % perRow) * gapX, y: sY + Math.floor(i / perRow) * gapY });
  return positions;
}

function seedDesks(sites) {
  return sites.flatMap((s) => {
    if (s.key === "dubai") return seedDubai();
    const spots = genericSpots(s.deskCount);
    return Array.from({ length: s.deskCount }, (_, i) => makeDesk(s.key, i + 1, spots[i].x, spots[i].y));
  });
}

function seedZones(sites) {
  const z = {};
  sites.forEach((s) => { z[s.key] = s.key === "dubai" ? DEFAULT_DUBAI_ZONES.map((zn) => ({ ...zn })) : []; });
  return z;
}
function seedAssets(sites) { const a = {}; sites.forEach((s) => { a[s.key] = []; }); return a; }
function seedPOs(sites) { const p = {}; sites.forEach((s) => { p[s.key] = []; }); return p; }

function emptyStock(siteKey) {
  const items = {};
  PRESET_ITEMS.forEach((i) => { items[i.key] = { spare: 0 }; });
  if (siteKey === "dubai") items.laptop = { spare: 0 };
  return { spares: items, custom: [] };
}
function seedStock(sites) { const o = {}; sites.forEach((s) => { o[s.key] = emptyStock(s.key); }); return o; }

function StatCard({ icon: Icon, label, value, color }) {
  return (
    <div className="flex items-center gap-3 rounded-md px-4 py-3" style={{ background: C.card, border: `1px solid ${C.border}` }}>
      <div className="flex h-9 w-9 shrink-0 items-center justify-center rounded" style={{ background: color }}><Icon className="h-4.5 w-4.5 text-white" strokeWidth={2} /></div>
      <div><div className="text-xl font-semibold tracking-tight" style={{ color: C.text }}>{value}</div><div className="text-[11px] font-medium" style={{ color: C.sub }}>{label}</div></div>
    </div>
  );
}

function siteSummary(desks) {
  return {
    total: desks.length,
    occupied: desks.filter((d) => d.status === "occupied").length,
    available: desks.filter((d) => d.status === "available").length,
    unavailable: desks.filter((d) => d.status === "unavailable").length,
  };
}
function inUseCount(desks, k) { return k === "monitors" ? desks.reduce((s, d) => s + d.equipment.monitors, 0) : desks.filter((d) => d.equipment[k]).length; }

// ---- Freeform floor canvas: draggable desks + draggable/resizable zone boxes ----
function FloorCanvas({ desks, zones, canEdit, width, height, onDragStart, onMoveDesk, onRotateDesk, onSelectDesk, onRemoveDesk, onMoveZone, onResizeZone, onEditZone, onToggleDoor, onRemoveZone }) {
  function startDeskDrag(e, desk) {
    if (!canEdit) return;
    e.stopPropagation();
    onDragStart();
    const startX = e.clientX, startY = e.clientY;
    const origX = desk.x, origY = desk.y;
    const maxX = (width || 1500) - 26, maxY = (height || 700) - 30;
    let moved = false;
    function onMove(ev) {
      const dx = ev.clientX - startX, dy = ev.clientY - startY;
      if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
      onMoveDesk(desk.id, Math.max(0, Math.min(maxX, origX + dx)), Math.max(0, Math.min(maxY, origY + dy)));
    }
    function onUp() {
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);
      if (!moved) onSelectDesk(desk);
    }
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
  }

  function startZoneDrag(e, zone, mode) {
    if (!canEdit) return;
    e.stopPropagation();
    onDragStart();
    const startX = e.clientX, startY = e.clientY;
    const orig = { x: zone.x, y: zone.y, w: zone.w, h: zone.h };
    const cw = width || 1500, ch = height || 700;
    function onMove(ev) {
      const dx = ev.clientX - startX, dy = ev.clientY - startY;
      if (mode === "move") {
        const maxX = cw - orig.w, maxY = ch - orig.h;
        onMoveZone(zone.id, Math.max(0, Math.min(maxX, orig.x + dx)), Math.max(0, Math.min(maxY, orig.y + dy)));
      } else {
        const maxW = cw - orig.x, maxH = ch - orig.y;
        onResizeZone(zone.id, Math.max(60, Math.min(maxW, orig.w + dx)), Math.max(40, Math.min(maxH, orig.h + dy)));
      }
    }
    function onUp() {
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);
    }
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
  }

  return (
    <div className="relative rounded" style={{
      width: width || 1500, height: height || 700, touchAction: "none",
      background: C.card, border: `2px solid ${C.border}`,
      backgroundImage: `linear-gradient(${C.grid} 1px, transparent 1px), linear-gradient(90deg, ${C.grid} 1px, transparent 1px)`,
      backgroundSize: "22px 22px",
    }}>
      {zones.map((z) => {
        const zt = ZONE_TYPES[z.type] || ZONE_TYPES.other;
        const doors = z.doors || [];
        const hasDoor = (wall) => doors.some((d) => d.wall === wall);
        return (
          <div key={z.id} className="absolute rounded-md group" style={{ left: z.x, top: z.y, width: z.w, height: z.h, background: zt.fill, border: `1.5px dashed ${zt.border}`, touchAction: "none" }}
            onPointerDown={(e) => startZoneDrag(e, z, "move")}>
            <span className="absolute left-2 top-1 text-[10px] font-semibold cursor-text" style={{ color: C.text }}
              onDoubleClick={(e) => { e.stopPropagation(); if (canEdit) onEditZone(z); }}>{z.label}</span>

            {doors.map((d, i) => {
              const style = { position: "absolute", background: "#fff" };
              if (d.wall === "N") { style.left = `${d.pos * 100}%`; style.top = -2; style.width = 18; style.height = 5; style.transform = "translateX(-50%)"; }
              if (d.wall === "S") { style.left = `${d.pos * 100}%`; style.bottom = -2; style.width = 18; style.height = 5; style.transform = "translateX(-50%)"; }
              if (d.wall === "W") { style.top = `${d.pos * 100}%`; style.left = -2; style.height = 18; style.width = 5; style.transform = "translateY(-50%)"; }
              if (d.wall === "E") { style.top = `${d.pos * 100}%`; style.right = -2; style.height = 18; style.width = 5; style.transform = "translateY(-50%)"; }
              return <div key={i} style={style} />;
            })}

            {canEdit && (
              <>
                <button className="absolute -top-2 -right-2 flex h-4 w-4 items-center justify-center rounded-full text-[10px] text-white opacity-0 group-hover:opacity-100" style={{ background: C.text }}
                  onPointerDown={(e) => e.stopPropagation()} onClick={(e) => { e.stopPropagation(); onRemoveZone(z.id); }}>×</button>
                <div className="absolute bottom-0 right-0 h-3 w-3 cursor-se-resize opacity-0 group-hover:opacity-100" style={{ background: zt.border }}
                  onPointerDown={(e) => startZoneDrag(e, z, "resize")} />
                <div className="absolute inset-0 hidden group-hover:block" style={{ pointerEvents: "none" }}>
                  {[
                    { wall: "N", style: { top: -9, left: "50%", transform: "translateX(-50%)" } },
                    { wall: "S", style: { bottom: -9, left: "50%", transform: "translateX(-50%)" } },
                    { wall: "W", style: { left: -9, top: "50%", transform: "translateY(-50%)" } },
                    { wall: "E", style: { right: -9, top: "50%", transform: "translateY(-50%)" } },
                  ].map((b) => (
                    <button key={b.wall} className="absolute flex h-4 w-4 items-center justify-center rounded-full text-[8px] font-bold"
                      style={{ ...b.style, pointerEvents: "auto", background: hasDoor(b.wall) ? C.primary : "#fff", color: hasDoor(b.wall) ? "#fff" : C.sub, border: `1px solid ${C.border}` }}
                      onPointerDown={(e) => e.stopPropagation()} onClick={(e) => { e.stopPropagation(); onToggleDoor(z.id, b.wall); }} title={`${hasDoor(b.wall) ? "Remove" : "Add"} door on this wall`}>D</button>
                  ))}
                </div>
              </>
            )}
          </div>
        );
      })}
      {desks.map((d) => {
        const s = SEAT[d.status];
        return (
          <div key={d.id} className="absolute group" style={{ left: d.x, top: d.y, width: 26, cursor: canEdit ? "grab" : "pointer", touchAction: "none" }}
            onPointerDown={(e) => startDeskDrag(e, d)}
            onClick={() => { if (!canEdit) onSelectDesk(d); }}>
            <div style={{ transform: `rotate(${d.rot || 0}deg)` }}>
              <div className="flex h-4 w-full items-center justify-center rounded-[4px]" style={{ background: s.fill, border: `1.5px ${s.dashed ? "dashed" : "solid"} ${s.stroke}` }}>
                <span className="text-[6.5px] font-semibold" style={{ color: s.stroke }}>{d.number}</span>
              </div>
              <span className="mx-auto mt-0.5 block h-1.5 w-1.5 rounded-full" style={{ background: s.seat, opacity: s.dashed ? 0.6 : 1 }} />
            </div>
            {d.user && <span className="pointer-events-none absolute -top-5 left-1/2 z-20 hidden -translate-x-1/2 whitespace-nowrap rounded bg-white px-1.5 py-0.5 text-[9px] shadow-sm group-hover:block" style={{ color: C.text, border: `1px solid ${C.grid}` }}>{d.user}</span>}
            {canEdit && (
              <>
                <button className="absolute -top-2 -left-2 hidden h-4 w-4 items-center justify-center rounded-full text-[9px] text-white group-hover:flex" style={{ background: C.text }}
                  onPointerDown={(e) => e.stopPropagation()} onClick={(e) => { e.stopPropagation(); onRotateDesk(d.id); }}><RotateCw className="h-2.5 w-2.5" /></button>
                <button className="absolute -top-2 -right-2 hidden h-4 w-4 items-center justify-center rounded-full text-[10px] text-white group-hover:flex" style={{ background: C.text }}
                  onPointerDown={(e) => e.stopPropagation()} onClick={(e) => { e.stopPropagation(); onRemoveDesk(d.id); }} title="Remove desk">×</button>
              </>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ---- Read-only 3D view of the same desks/zones, manual orbit (no OrbitControls dependency) ----
function Floor3D({ desks, zones, onSelectDesk }) {
  const mountRef = useRef(null);
  const resetRef = useRef(null);
  const autoRotateRef = useRef(false);
  const [unsupported, setUnsupported] = useState(false);
  const [autoRotate, setAutoRotate] = useState(false);

  useEffect(() => { autoRotateRef.current = autoRotate; }, [autoRotate]);

  useEffect(() => {
    const mount = mountRef.current;
    if (!mount) return;
    let renderer, raf, scene, camera;
    let disposed = false;
    try {
      const width = mount.clientWidth, height = 520;
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0xf3f2ee);

      const SCALE = 1 / 30;
      const DESK_W = 26, DESK_H = 30;
      const xs = [...zones.flatMap((z) => [z.x, z.x + z.w]), ...desks.flatMap((d) => [d.x, d.x + DESK_W])];
      const ys = [...zones.flatMap((z) => [z.y, z.y + z.h]), ...desks.flatMap((d) => [d.y, d.y + DESK_H])];
      const minX = xs.length ? Math.min(...xs) : 0, maxX = xs.length ? Math.max(...xs) : 400;
      const minY = ys.length ? Math.min(...ys) : 0, maxY = ys.length ? Math.max(...ys) : 400;
      const cx = ((minX + maxX) / 2) * SCALE;
      const cz = ((minY + maxY) / 2) * SCALE;
      const spanX = (maxX - minX) * SCALE, spanZ = (maxY - minY) * SCALE;
      const span = Math.max(spanX, spanZ, 6);

      camera = new THREE.PerspectiveCamera(42, width / height, 0.5, span * 20);
      scene.fog = new THREE.Fog(0xf3f2ee, span * 1.6, span * 4.5);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(width, height);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      mount.innerHTML = "";
      mount.appendChild(renderer.domElement);

      scene.add(new THREE.AmbientLight(0xffffff, 0.55));
      const hemi = new THREE.HemisphereLight(0xffffff, 0xcfcabb, 0.45);
      scene.add(hemi);
      const dir = new THREE.DirectionalLight(0xfff3e0, 0.9);
      dir.position.set(cx + span * 0.6, span * 1.1, cz + span * 0.4);
      dir.castShadow = true;
      dir.shadow.mapSize.set(1024, 1024);
      dir.shadow.camera.left = -span; dir.shadow.camera.right = span;
      dir.shadow.camera.top = span; dir.shadow.camera.bottom = -span;
      dir.shadow.camera.near = 0.5; dir.shadow.camera.far = span * 4;
      dir.target.position.set(cx, 0, cz);
      scene.add(dir); scene.add(dir.target);

      const groundGeo = new THREE.PlaneGeometry(spanX + span * 0.6, spanZ + span * 0.6);
      const groundMat = new THREE.MeshStandardMaterial({ color: 0xe9e7de, roughness: 0.95 });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2;
      ground.position.set(cx, -0.03, cz);
      ground.receiveShadow = true;
      scene.add(ground);

      const grid = new THREE.GridHelper(Math.max(spanX, spanZ) + span * 0.6, 24, 0xc9c6ba, 0xdcd9cd);
      grid.position.set(cx, 0, cz);
      scene.add(grid);

      function makeLabelSprite(text, color) {
        const canvasEl = document.createElement("canvas");
        const ctx = canvasEl.getContext("2d");
        const fontSize = 44;
        ctx.font = `600 ${fontSize}px 'Segoe UI', sans-serif`;
        const textWidth = ctx.measureText(text).width;
        canvasEl.width = textWidth + 40;
        canvasEl.height = fontSize + 24;
        ctx.font = `600 ${fontSize}px 'Segoe UI', sans-serif`;
        ctx.fillStyle = "rgba(255,255,255,0.88)";
        ctx.fillRect(0, 0, canvasEl.width, canvasEl.height);
        ctx.fillStyle = color;
        ctx.textBaseline = "middle";
        ctx.fillText(text, 20, canvasEl.height / 2);
        const texture = new THREE.CanvasTexture(canvasEl);
        const mat = new THREE.SpriteMaterial({ map: texture, depthTest: false });
        const sprite = new THREE.Sprite(mat);
        const worldW = canvasEl.width * 0.012;
        const worldH = canvasEl.height * 0.012;
        sprite.scale.set(worldW, worldH, 1);
        return sprite;
      }

      zones.forEach((z) => {
        const zt = ZONE_TYPES[z.type] || ZONE_TYPES.other;
        const w = z.w * SCALE, d = z.h * SCALE, wallH = 1.1, wallT = 0.04;
        const cxz = (z.x + z.w / 2) * SCALE, czz = (z.y + z.h / 2) * SCALE;
        const colorHex = "#" + zt.tint.toString(16).padStart(6, "0");

        const floorMat = new THREE.MeshStandardMaterial({ color: zt.tint, transparent: true, opacity: 0.28, roughness: 0.9 });
        const floorPatch = new THREE.Mesh(new THREE.PlaneGeometry(w, d), floorMat);
        floorPatch.rotation.x = -Math.PI / 2;
        floorPatch.position.set(cxz, 0.015, czz);
        floorPatch.receiveShadow = true;
        scene.add(floorPatch);

        const wallMat = new THREE.MeshStandardMaterial({ color: zt.tint, roughness: 0.85 });
        const doors = z.doors || [];
        const doorGap = Math.min(1.0, w * 0.8, d * 0.8);
        function wallSegments(totalLen, wallDoors) {
          if (!wallDoors.length) return [{ start: 0, end: totalLen }];
          const centerLen = wallDoors[0].pos * totalLen;
          const halfGap = Math.min(doorGap / 2, totalLen / 2 - 0.05);
          const segs = [];
          if (centerLen - halfGap > 0.05) segs.push({ start: 0, end: centerLen - halfGap });
          if (totalLen - (centerLen + halfGap) > 0.05) segs.push({ start: centerLen + halfGap, end: totalLen });
          return segs;
        }
        function addWallBox(len, thick, cxw, czw, alongX) {
          const geo = alongX ? new THREE.BoxGeometry(len, wallH, thick) : new THREE.BoxGeometry(thick, wallH, len);
          const wall = new THREE.Mesh(geo, wallMat);
          wall.position.set(cxw, wallH / 2, czw);
          wall.castShadow = true; wall.receiveShadow = true;
          scene.add(wall);
        }
        wallSegments(w, doors.filter((dd) => dd.wall === "N")).forEach((seg) => {
          addWallBox(seg.end - seg.start, wallT, cxz - w / 2 + (seg.start + seg.end) / 2, czz - d / 2, true);
        });
        wallSegments(w, doors.filter((dd) => dd.wall === "S")).forEach((seg) => {
          addWallBox(seg.end - seg.start, wallT, cxz - w / 2 + (seg.start + seg.end) / 2, czz + d / 2, true);
        });
        wallSegments(d, doors.filter((dd) => dd.wall === "W")).forEach((seg) => {
          addWallBox(seg.end - seg.start, wallT, cxz - w / 2, czz - d / 2 + (seg.start + seg.end) / 2, false);
        });
        wallSegments(d, doors.filter((dd) => dd.wall === "E")).forEach((seg) => {
          addWallBox(seg.end - seg.start, wallT, cxz + w / 2, czz - d / 2 + (seg.start + seg.end) / 2, false);
        });

        if (z.label) {
          const label = makeLabelSprite(z.label, colorHex);
          label.position.set(cxz, wallH + 0.5, czz);
          scene.add(label);
        }
      });

      const deskHitMeshes = [];
      desks.forEach((d) => {
        const color = d.status === "occupied" ? 0xe0787a : d.status === "available" ? 0x6fbf7f : 0xb9c0c6;
        const px = (d.x + 13) * SCALE, pz = (d.y + 15) * SCALE;
        const group = new THREE.Group();
        group.position.set(px, 0, pz);
        group.rotation.y = -((d.rot || 0) * Math.PI) / 180;

        const hitbox = new THREE.Mesh(new THREE.BoxGeometry(1.3, 1.3, 1.7), new THREE.MeshBasicMaterial({ visible: false }));
        hitbox.position.set(0, 0.5, 0.15);
        hitbox.userData.deskId = d.id;
        group.add(hitbox);
        deskHitMeshes.push(hitbox);

        const topMat = new THREE.MeshStandardMaterial({ color: 0xf5f3ec, roughness: 0.7 });
        const legMat = new THREE.MeshStandardMaterial({ color: 0xb7b4a8, roughness: 0.6, metalness: 0.2 });
        const top = new THREE.Mesh(new THREE.BoxGeometry(1.15, 0.07, 0.65), topMat);
        top.position.y = 0.55; top.castShadow = true; top.receiveShadow = true;
        group.add(top);
        [[-0.5, -0.27], [0.5, -0.27], [-0.5, 0.27], [0.5, 0.27]].forEach(([lx, lz]) => {
          const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.55, 6), legMat);
          leg.position.set(lx, 0.27, lz);
          leg.castShadow = true;
          group.add(leg);
        });

        const monitorCount = Math.min(2, d.equipment?.monitors || 0);
        for (let i = 0; i < monitorCount; i++) {
          const mw = monitorCount === 1 ? 0.42 : 0.34;
          const monitor = new THREE.Mesh(new THREE.BoxGeometry(mw, 0.26, 0.03), new THREE.MeshStandardMaterial({ color: 0x2b3a46 }));
          const offset = monitorCount === 1 ? 0 : i === 0 ? -0.3 : 0.3;
          monitor.position.set(offset, 0.72, -0.28);
          monitor.castShadow = true;
          group.add(monitor);
        }

        const seatColor = new THREE.MeshStandardMaterial({ color, roughness: 0.6 });
        const seat = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.3, 0.09, 14), seatColor);
        seat.position.set(0, 0.42, 0.68);
        seat.castShadow = true;
        group.add(seat);
        const back = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.42, 0.07), seatColor);
        back.position.set(0, 0.66, 0.9);
        back.castShadow = true;
        group.add(back);
        const post = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.42, 8), legMat);
        post.position.set(0, 0.2, 0.68);
        group.add(post);

        scene.add(group);
      });

      const radius0 = span * 0.85;
      let azimuth = Math.PI / 4, elevation = 0.75, radius = radius0;

      function updateCamera() {
        const x = cx + radius * Math.cos(elevation) * Math.sin(azimuth);
        const y = radius * Math.sin(elevation);
        const z = cz + radius * Math.cos(elevation) * Math.cos(azimuth);
        camera.position.set(x, Math.max(1.2, y), z);
        camera.lookAt(cx, 0.3, cz);
      }
      updateCamera();
      resetRef.current = () => { azimuth = Math.PI / 4; elevation = 0.75; radius = radius0; updateCamera(); };

      const raycaster = new THREE.Raycaster();
      const pointerNdc = new THREE.Vector2();
      function handleClick(clientX, clientY) {
        if (!onSelectDesk) return;
        const rect = renderer.domElement.getBoundingClientRect();
        pointerNdc.x = ((clientX - rect.left) / rect.width) * 2 - 1;
        pointerNdc.y = -((clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(pointerNdc, camera);
        const hits = raycaster.intersectObjects(deskHitMeshes);
        if (hits.length) {
          const deskId = hits[0].object.userData.deskId;
          const desk = desks.find((d) => d.id === deskId);
          if (desk) onSelectDesk(desk);
        }
      }

      let dragging = false, lastX = 0, lastY = 0, totalMove = 0;
      function onDown(e) { dragging = true; lastX = e.clientX; lastY = e.clientY; totalMove = 0; }
      function onMove(e) {
        if (!dragging) return;
        const dx = e.clientX - lastX, dy = e.clientY - lastY;
        lastX = e.clientX; lastY = e.clientY;
        totalMove += Math.abs(dx) + Math.abs(dy);
        azimuth -= dx * 0.006;
        elevation = Math.min(1.45, Math.max(0.12, elevation + dy * 0.006));
        updateCamera();
      }
      function onUp(e) {
        dragging = false;
        if (totalMove < 6) handleClick(e.clientX, e.clientY);
      }
      function onWheel(e) {
        e.preventDefault();
        radius = Math.min(radius0 * 3, Math.max(radius0 * 0.25, radius + e.deltaY * 0.05));
        updateCamera();
      }
      renderer.domElement.style.touchAction = "none";
      renderer.domElement.addEventListener("pointerdown", onDown);
      window.addEventListener("pointermove", onMove);
      window.addEventListener("pointerup", onUp);
      renderer.domElement.addEventListener("wheel", onWheel, { passive: false });

      function loop() {
        if (disposed) return;
        if (autoRotateRef.current && !dragging) { azimuth += 0.0025; updateCamera(); }
        renderer.render(scene, camera);
        raf = requestAnimationFrame(loop);
      }
      loop();

      return () => {
        disposed = true;
        cancelAnimationFrame(raf);
        renderer.domElement.removeEventListener("pointerdown", onDown);
        window.removeEventListener("pointermove", onMove);
        window.removeEventListener("pointerup", onUp);
        renderer.domElement.removeEventListener("wheel", onWheel);
        renderer.dispose();
        if (mount.contains(renderer.domElement)) mount.removeChild(renderer.domElement);
      };
    } catch (err) {
      setUnsupported(true);
    }
  }, [desks, zones]);

  if (unsupported) {
    return <div className="flex h-[520px] items-center justify-center rounded-lg text-sm" style={{ background: C.card, border: `1px solid ${C.border}`, color: C.sub }}>3D view isn't supported in this browser.</div>;
  }
  return (
    <div className="relative">
      <div ref={mountRef} className="overflow-hidden rounded-lg" style={{ border: `1px solid ${C.border}`, height: 520 }} />
      <div className="absolute right-2 top-2 flex items-center gap-2 print:hidden">
        <label className="flex items-center gap-1.5 rounded px-2 py-1 text-xs font-medium shadow-sm" style={{ background: "rgba(255,255,255,0.9)", border: `1px solid ${C.border}`, color: C.text }}>
          <input type="checkbox" checked={autoRotate} onChange={(e) => setAutoRotate(e.target.checked)} /> Auto-rotate
        </label>
        <button onClick={() => resetRef.current && resetRef.current()} className="rounded px-2 py-1 text-xs font-medium shadow-sm" style={{ background: "rgba(255,255,255,0.9)", border: `1px solid ${C.border}`, color: C.text }}>Reset view</button>
      </div>
    </div>
  );
}

function EquipRow({ icon: Icon, label, checked, model, disabled, onToggle, onModel }) {
  return (
    <div className="flex items-center gap-2 rounded px-2.5 py-1.5 text-xs" style={{ border: `1px solid ${C.border}` }}>
      <Icon className="h-3.5 w-3.5 shrink-0" style={{ color: C.sub }} />
      <label className="flex items-center gap-1.5 shrink-0">
        <input type="checkbox" disabled={disabled} checked={checked} onChange={(e) => onToggle(e.target.checked)} /> {label}
      </label>
      {checked && (
        <input disabled={disabled} defaultValue={model || ""} placeholder="Model (optional)" className="ml-auto w-28 rounded px-1.5 py-0.5 text-[11px]" style={{ border: `1px solid ${C.border}` }} onBlur={(e) => { if (e.target.value !== model) onModel(e.target.value); }} />
      )}
    </div>
  );
}

function DeskDashboard() {
  const [tab, setTab] = useState("overview");
  const [siteView, setSiteView] = useState("floor");
  const [sites, setSites] = useState([]);
  const [desks, setDesks] = useState([]);
  const [zones, setZones] = useState({});
  const [assets, setAssets] = useState({});
  const [purchaseOrders, setPurchaseOrders] = useState({});
  const [stock, setStock] = useState({});
  const [loading, setLoading] = useState(true);
  const [saveError, setSaveError] = useState(false);
  const [selected, setSelected] = useState(null);
  const [zoneEdit, setZoneEdit] = useState(null);
  const [query, setQuery] = useState("");
  const [role, setRole] = useState(() => {
    if (!window.dtFirebaseEnabled) return "admin";
    try { return sessionStorage.getItem("dt_admin") === "1" ? "admin" : "viewer"; } catch (e) { return "viewer"; }
  });
  const [loginOpen, setLoginOpen] = useState(false);
  const [loginPassword, setLoginPassword] = useState("");
  const [loginError, setLoginError] = useState("");
  const [manageOpen, setManageOpen] = useState(false);
  const [newSiteLabel, setNewSiteLabel] = useState("");
  const [newSiteCount, setNewSiteCount] = useState(10);
  const [newZoneType, setNewZoneType] = useState("office");
  const [assetForm, setAssetForm] = useState({ name: "", model: "", qty: 1, note: "" });
  const [poForm, setPoForm] = useState({ poNumber: "", date: "", vendor: "", item: "", qty: 1, unitCost: "", note: "" });
  const [canUndo, setCanUndo] = useState(false);
  const fileInputRef = useRef(null);
  const undoStack = useRef([]);

  const [loadError, setLoadError] = useState(false);

  async function loadAllData() {
    setLoading(true);
    setLoadError(false);
    try {
      // Deliberately NOT catching individual read errors here — if a read
      // genuinely fails (network, permissions, etc), we must not treat that
      // the same as "no data exists yet." A failed read throws and is
      // handled below by showing an error, never by seeding/overwriting.
      const [sRes, dRes, stRes, zRes, aRes, poRes] = await Promise.all([
        window.storage.get("sites-v2", true),
        window.storage.get("desks-v6", true),
        window.storage.get("stock-v3", true),
        window.storage.get("zones-v1", true),
        window.storage.get("assets-v1", true),
        window.storage.get("po-v1", true),
      ]);
      const ls = sRes?.value ? JSON.parse(sRes.value) : DEFAULT_SITES;
      const ld = dRes?.value ? JSON.parse(dRes.value) : seedDesks(ls);
      const lst = stRes?.value ? JSON.parse(stRes.value) : seedStock(ls);
      const lz = zRes?.value ? JSON.parse(zRes.value) : seedZones(ls);
      const la = aRes?.value ? JSON.parse(aRes.value) : seedAssets(ls);
      const lpo = poRes?.value ? JSON.parse(poRes.value) : seedPOs(ls);
      setSites(ls); setDesks(ld); setStock(lst); setZones(lz); setAssets(la); setPurchaseOrders(lpo);
      // Only ever write a default back when the read genuinely succeeded
      // AND came back completely empty (brand-new setup) — never on a
      // failed/uncertain read.
      if (sRes === null) await window.storage.set("sites-v2", JSON.stringify(ls), true);
      if (dRes === null) await window.storage.set("desks-v6", JSON.stringify(ld), true);
      if (stRes === null) await window.storage.set("stock-v3", JSON.stringify(lst), true);
      if (zRes === null) await window.storage.set("zones-v1", JSON.stringify(lz), true);
      if (aRes === null) await window.storage.set("assets-v1", JSON.stringify(la), true);
      if (poRes === null) await window.storage.set("po-v1", JSON.stringify(lpo), true);
    } catch (err) {
      console.error("Failed to load saved data:", err);
      // Do NOT seed or write anything here — an unreadable database must
      // never be silently replaced with fresh demo data.
      setLoadError(true);
    } finally { setLoading(false); }
  }

  useEffect(() => { loadAllData(); }, []);

  const ADMIN_PASSWORD = "515085";
  function handleLogin() {
    setLoginError("");
    if (loginPassword === ADMIN_PASSWORD) {
      setRole("admin");
      setLoginOpen(false);
      setLoginPassword("");
      try { sessionStorage.setItem("dt_admin", "1"); } catch (e) {}
    } else {
      setLoginError("Incorrect password");
    }
  }
  function handleLogout() {
    setRole("viewer");
    try { sessionStorage.removeItem("dt_admin"); } catch (e) {}
  }

  function snapshot() { return { sites, desks, stock, zones, assets, purchaseOrders }; }
  function pushUndo() {
    undoStack.current.push(snapshot());
    if (undoStack.current.length > 15) undoStack.current.shift();
    setCanUndo(true);
  }
  function undo() {
    const prev = undoStack.current.pop();
    if (!prev) return;
    setCanUndo(undoStack.current.length > 0);
    persistAll(prev.sites, prev.desks, prev.stock, prev.zones, prev.assets, prev.purchaseOrders);
  }

  async function persistAll(ns, nd, nst, nz, na, npo) {
    setSites(ns); setDesks(nd); setStock(nst);
    if (nz) setZones(nz);
    if (na) setAssets(na);
    if (npo) setPurchaseOrders(npo);
    try {
      const calls = [
        window.storage.set("sites-v2", JSON.stringify(ns), true),
        window.storage.set("desks-v6", JSON.stringify(nd), true),
        window.storage.set("stock-v3", JSON.stringify(nst), true),
      ];
      if (nz) calls.push(window.storage.set("zones-v1", JSON.stringify(nz), true));
      if (na) calls.push(window.storage.set("assets-v1", JSON.stringify(na), true));
      if (npo) calls.push(window.storage.set("po-v1", JSON.stringify(npo), true));
      const r = await Promise.all(calls);
      setSaveError(r.some((x) => !x));
    } catch { setSaveError(true); }
  }

  function updateDesk(id, patch, action) {
    pushUndo();
    const next = desks.map((d) => { if (d.id !== id) return d; const u = { ...d, ...patch }; if (action) u.history = [{ ts: Date.now(), action, by: "You" }, ...d.history].slice(0, 8); return u; });
    persistAll(sites, next, stock, zones, assets);
    setSelected((c) => (c && c.id === id ? next.find((d) => d.id === id) : c));
  }
  function moveDesk(id, x, y) { setDesks((prev) => prev.map((d) => (d.id === id ? { ...d, x, y } : d))); }
  function commitDeskPosition() { persistAll(sites, desks, stock, zones, assets); }
  function rotateDesk(id) {
    pushUndo();
    const next = desks.map((d) => (d.id === id ? { ...d, rot: ((d.rot || 0) + 90) % 360 } : d));
    persistAll(sites, next, stock, zones, assets);
  }
  function removeDesk(sk, id) {
    pushUndo();
    const remaining = desks.filter((d) => d.site === sk && d.id !== id).sort((a, b) => a.number - b.number);
    const renumbered = remaining.map((d, i) => ({ ...d, number: i + 1 }));
    const nd = desks.filter((d) => d.site !== sk).concat(renumbered);
    const ns = sites.map((s) => (s.key === sk ? { ...s, deskCount: Math.max(0, s.deskCount - 1) } : s));
    persistAll(ns, nd, stock, zones, assets);
    setSelected((c) => (c && c.id === id ? null : c));
  }

  function updateSiteCanvas(key, w, h) {
    persistAll(sites.map((s) => (s.key === key ? { ...s, canvasW: Math.max(400, w), canvasH: Math.max(300, h) } : s)), desks, stock, zones, assets);
  }
  function updateSiteCount(key, nc) {
    pushUndo();
    const cur = desks.filter((d) => d.site === key).sort((a, b) => a.number - b.number); let nd = desks;
    if (nc > cur.length) { const spots = genericSpots(nc).slice(cur.length); nd = [...desks, ...Array.from({ length: nc - cur.length }, (_, i) => makeDesk(key, cur.length + i + 1, spots[i].x, spots[i].y))]; }
    else if (nc < cur.length) { const keep = new Set(cur.slice(0, nc).map((d) => d.id)); nd = desks.filter((d) => d.site !== key || keep.has(d.id)); }
    persistAll(sites.map((s) => (s.key === key ? { ...s, deskCount: nc } : s)), nd, stock, zones, assets);
  }
  function resetDubaiToFloorPlan() {
    if (!confirm("Replace the current Dubai Office layout with the traced floor plan? This overwrites Dubai's current desks and spaces — Undo will bring it back if needed.")) return;
    pushUndo();
    const freshZones = DEFAULT_DUBAI_ZONES.map((z) => ({ ...z, doors: [...(z.doors || [])] }));
    const freshDesks = seedDubai();
    const nd = desks.filter((d) => d.site !== "dubai").concat(freshDesks);
    const ns = sites.map((s) => (s.key === "dubai" ? { ...s, deskCount: freshDesks.length } : s));
    persistAll(ns, nd, stock, { ...zones, dubai: freshZones }, assets, purchaseOrders);
  }
  function removeSite(key) {
    pushUndo();
    const nst = { ...stock }; delete nst[key];
    const nz = { ...zones }; delete nz[key];
    const na = { ...assets }; delete na[key];
    persistAll(sites.filter((s) => s.key !== key), desks.filter((d) => d.site !== key), nst, nz, na);
    if (tab === key) setTab("overview");
  }
  function toggleSiteHidden(key) {
    const nextHidden = !sites.find((s) => s.key === key)?.hidden;
    persistAll(sites.map((s) => (s.key === key ? { ...s, hidden: nextHidden } : s)), desks, stock, zones, assets);
    if (tab === key && nextHidden) setTab("overview");
  }
  function addSite() {
    if (!newSiteLabel.trim()) return;
    pushUndo();
    const key = newSiteLabel.trim().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
    if (sites.some((s) => s.key === key)) return;
    const spots = genericSpots(Number(newSiteCount) || 0);
    const site = { key, label: newSiteLabel.trim(), deskCount: Number(newSiteCount) || 0, canvasW: 900, canvasH: 600, hidden: false };
    persistAll(
      [...sites, site],
      [...desks, ...Array.from({ length: site.deskCount }, (_, i) => makeDesk(key, i + 1, spots[i].x, spots[i].y))],
      { ...stock, [key]: emptyStock(key) },
      { ...zones, [key]: [] },
      { ...assets, [key]: [] }
    );
    setNewSiteLabel(""); setNewSiteCount(10);
  }
  function updateSpare(sk, ik, v) { persistAll(sites, desks, { ...stock, [sk]: { ...stock[sk], spares: { ...stock[sk].spares, [ik]: { spare: Math.max(0, Number(v) || 0) } } } }, zones, assets); }
  function addCustomItem(sk, name) { if (!name.trim()) return; persistAll(sites, desks, { ...stock, [sk]: { ...stock[sk], custom: [...(stock[sk]?.custom || []), { id: `${Date.now()}`, name: name.trim(), inUse: 0, spare: 0 }] } }, zones, assets); }
  function updateCustomItem(sk, id, patch) { persistAll(sites, desks, { ...stock, [sk]: { ...stock[sk], custom: stock[sk].custom.map((c) => (c.id === id ? { ...c, ...patch } : c)) } }, zones, assets); }
  function removeCustomItem(sk, id) { persistAll(sites, desks, { ...stock, [sk]: { ...stock[sk], custom: stock[sk].custom.filter((c) => c.id !== id) } }, zones, assets); }

  // ---- Zone (box) helpers, per site ----
  function addDeskToSite(sk) {
    pushUndo();
    const cur = desks.filter((d) => d.site === sk);
    const nextNum = cur.length ? Math.max(...cur.map((d) => d.number)) + 1 : 1;
    const nd = [...desks, makeDesk(sk, nextNum, 60, 60)];
    persistAll(sites.map((s) => (s.key === sk ? { ...s, deskCount: s.deskCount + 1 } : s)), nd, stock, zones, assets);
  }
  function addZone(sk, type) {
    pushUndo();
    const list = zones[sk] || [];
    const z = { id: `z${Date.now()}`, label: ZONE_TYPES[type].label, type, x: 40 + (list.length % 6) * 20, y: 40 + (list.length % 6) * 20, w: 160, h: 100, doors: [] };
    persistAll(sites, desks, stock, { ...zones, [sk]: [...list, z] }, assets);
  }
  function moveZone(sk, id, x, y) { setZones((prev) => ({ ...prev, [sk]: prev[sk].map((z) => (z.id === id ? { ...z, x, y } : z)) })); }
  function resizeZone(sk, id, w, h) { setZones((prev) => ({ ...prev, [sk]: prev[sk].map((z) => (z.id === id ? { ...z, w, h } : z)) })); }
  function commitZones() { persistAll(sites, desks, stock, zones, assets); }
  function saveZoneEdit(sk, id, patch) {
    pushUndo();
    const list = zones[sk] || [];
    persistAll(sites, desks, stock, { ...zones, [sk]: list.map((zz) => (zz.id === id ? { ...zz, ...patch } : zz)) }, assets);
  }
  function toggleDoor(sk, id, wall) {
    pushUndo();
    const list = zones[sk] || [];
    const nz = list.map((zz) => {
      if (zz.id !== id) return zz;
      const doors = zz.doors || [];
      const exists = doors.some((d) => d.wall === wall);
      return { ...zz, doors: exists ? doors.filter((d) => d.wall !== wall) : [...doors, { wall, pos: 0.5 }] };
    });
    persistAll(sites, desks, stock, { ...zones, [sk]: nz }, assets);
  }
  function removeZone(sk, id) {
    pushUndo();
    persistAll(sites, desks, stock, { ...zones, [sk]: (zones[sk] || []).filter((z) => z.id !== id) }, assets);
  }

  // ---- Manual assets, per site ----
  function addAsset(sk) {
    if (!assetForm.name.trim()) return;
    pushUndo();
    const list = assets[sk] || [];
    const entry = { id: `a${Date.now()}`, name: assetForm.name.trim(), model: assetForm.model.trim(), qty: Math.max(1, Number(assetForm.qty) || 1), note: assetForm.note.trim(), addedAt: Date.now() };
    persistAll(sites, desks, stock, zones, { ...assets, [sk]: [...list, entry] });
    setAssetForm({ name: "", model: "", qty: 1, note: "" });
  }
  function removeAsset(sk, id) {
    pushUndo();
    persistAll(sites, desks, stock, zones, { ...assets, [sk]: (assets[sk] || []).filter((a) => a.id !== id) });
  }

  // ---- Purchase orders, per site ----
  function addPO(sk) {
    if (!poForm.poNumber.trim() || !poForm.item.trim()) return;
    pushUndo();
    const list = purchaseOrders[sk] || [];
    const entry = {
      id: `po${Date.now()}`,
      poNumber: poForm.poNumber.trim(),
      date: poForm.date || new Date().toISOString().slice(0, 10),
      vendor: poForm.vendor.trim(),
      item: poForm.item.trim(),
      qty: Math.max(1, Number(poForm.qty) || 1),
      unitCost: poForm.unitCost === "" ? null : Number(poForm.unitCost),
      note: poForm.note.trim(),
      addedAt: Date.now(),
    };
    persistAll(sites, desks, stock, zones, assets, { ...purchaseOrders, [sk]: [...list, entry] });
    setPoForm({ poNumber: poForm.poNumber, date: poForm.date, vendor: poForm.vendor, item: "", qty: 1, unitCost: "", note: "" });
  }
  function removePO(sk, id) {
    pushUndo();
    persistAll(sites, desks, stock, zones, assets, { ...purchaseOrders, [sk]: (purchaseOrders[sk] || []).filter((p) => p.id !== id) });
  }

  // ---- Backup export / import ----
  function exportData() {
    const payload = { exportedAt: new Date().toISOString(), sites, desks, stock, zones, assets };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `desk-tracker-backup-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }
  function importData(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const payload = JSON.parse(reader.result);
        if (!payload.sites || !payload.desks) throw new Error("bad file");
        pushUndo();
        persistAll(payload.sites, payload.desks, payload.stock || {}, payload.zones || {}, payload.assets || {});
      } catch {
        alert("Couldn't read that file — make sure it's a backup exported from this app.");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  }

  const visibleSites = useMemo(() => sites.filter((s) => !s.hidden), [sites]);
  const globalSummary = useMemo(() => siteSummary(desks.filter((d) => visibleSites.some((s) => s.key === d.site))), [desks, visibleSites]);
  const searchResults = useMemo(() => { if (!query.trim()) return []; const q = query.toLowerCase(); return desks.filter((d) => d.id.toLowerCase().includes(q) || String(d.number).includes(q) || (d.user && d.user.toLowerCase().includes(q))); }, [query, desks]);
  const canEdit = role === "admin";
  const navTabs = [{ key: "overview", label: "Overview" }, { key: "people", label: "People" }, ...visibleSites];
  const totalAssets = useMemo(() => Object.values(assets).reduce((s, list) => s + (list || []).reduce((ss, a) => ss + a.qty, 0), 0), [assets]);

  const peopleDirectory = useMemo(() => {
    const map = {};
    desks.filter((d) => d.user && visibleSites.some((s) => s.key === d.site)).forEach((d) => {
      if (!map[d.user]) map[d.user] = { name: d.user, entries: [] };
      const site = visibleSites.find((s) => s.key === d.site);
      map[d.user].entries.push({ siteLabel: site ? site.label : d.site, siteKey: d.site, number: d.number, equipment: d.equipment });
    });
    return Object.values(map).sort((a, b) => a.name.localeCompare(b.name));
  }, [desks, visibleSites]);
  const knownUserNames = useMemo(() => [...new Set(desks.filter((d) => d.user).map((d) => d.user))].sort(), [desks]);

  useEffect(() => {
    if (tab !== "overview" && tab !== "people" && !visibleSites.some((s) => s.key === tab)) setTab("overview");
  }, [visibleSites, tab]);

  if (loading) return <div className="flex min-h-screen items-center justify-center" style={{ background: C.bg, color: C.sub }}><Loader2 className="h-5 w-5 animate-spin" /></div>;

  if (loadError) return (
    <div className="flex min-h-screen items-center justify-center p-6" style={{ background: C.bg }}>
      <div className="max-w-sm rounded-md p-5 text-center" style={{ background: C.card, border: `1px solid ${C.border}` }}>
        <AlertTriangle className="mx-auto mb-2 h-6 w-6" style={{ color: SEAT.occupied.color }} />
        <p className="mb-1 text-sm font-semibold">Couldn't load your saved data</p>
        <p className="mb-4 text-xs" style={{ color: C.sub }}>This is likely a connection or Firebase issue. Your saved data has <b>not</b> been changed or overwritten — nothing will be touched until this loads successfully. Check your connection and try again.</p>
        <button onClick={loadAllData} className="rounded px-3 py-1.5 text-sm font-medium text-white" style={{ background: C.primary }}>Retry</button>
      </div>
    </div>
  );

  const globalStock = {};
  PRESET_ITEMS.concat([{ key: "laptop", label: "Laptops" }]).forEach((item) => {
    let inUse = 0, spare = 0;
    visibleSites.forEach((s) => { if (!(item.key in (stock[s.key]?.spares || {}))) return; inUse += inUseCount(desks.filter((d) => d.site === s.key), item.key); spare += stock[s.key]?.spares?.[item.key]?.spare || 0; });
    globalStock[item.key] = { inUse, spare, label: item.label };
  });

  return (
    <div className="min-h-screen p-6 print:p-0" style={{ background: C.bg, color: C.text, fontFamily: "'Segoe UI', system-ui, -apple-system, sans-serif" }}>
      <div className="mx-auto max-w-7xl">
        <header className="mb-5 flex flex-wrap items-center justify-between gap-3 print:hidden">
          <div><h1 className="text-lg font-semibold tracking-tight">Seat & Desk Tracker</h1><p className="text-xs" style={{ color: C.sub }}>Dixstone IT{saveError && <span className="ml-2" style={{ color: SEAT.occupied.color }}>· save failed</span>}</p></div>
          <div className="flex flex-wrap items-center gap-2">
            <div className="relative">
              <Search className="pointer-events-none absolute left-2.5 top-2.5 h-3.5 w-3.5" style={{ color: C.sub }} />
              <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Find desk or user…" className="w-44 rounded py-1.5 pl-8 pr-2 text-xs outline-none" style={{ background: C.card, border: `1px solid ${C.border}` }} />
              {searchResults.length > 0 && (
                <div className="absolute right-0 z-30 mt-1 w-64 rounded-md p-1 shadow-lg" style={{ background: C.card, border: `1px solid ${C.border}` }}>
                  {searchResults.slice(0, 6).map((d) => (
                    <button key={d.id} onClick={() => { setTab(d.site); setSiteView("floor"); setSelected(d); setQuery(""); }} className="flex w-full items-center justify-between rounded px-2 py-1.5 text-left text-xs hover:bg-slate-50">
                      <span className="font-medium">#{d.number}</span><span style={{ color: C.sub }}>{d.user ?? "unassigned"} · {sites.find((s) => s.key === d.site)?.label}</span>
                    </button>
                  ))}
                </div>
              )}
            </div>
            {canEdit && <button disabled={!canUndo} onClick={undo} className="flex items-center gap-1.5 rounded px-2.5 py-1.5 text-xs font-medium disabled:opacity-40" style={{ background: C.card, border: `1px solid ${C.border}` }}><Undo2 className="h-3.5 w-3.5" /> Undo</button>}
            {canEdit && <button onClick={() => setManageOpen(true)} className="flex items-center gap-1.5 rounded px-2.5 py-1.5 text-xs font-medium" style={{ background: C.card, border: `1px solid ${C.border}` }}><Settings className="h-3.5 w-3.5" /> Manage Sites</button>}
            <button onClick={exportData} className="flex items-center gap-1.5 rounded px-2.5 py-1.5 text-xs font-medium" style={{ background: C.card, border: `1px solid ${C.border}` }}><Download className="h-3.5 w-3.5" /> Export</button>

                      </tbody>
                      {sitePOs.some((p) => p.unitCost != null) && (
                        <tfoot><tr><td colSpan={6} className="px-3 py-2 text-right text-xs font-medium" style={{ color: C.sub }}>Total spent</td><td className="px-3 py-2 font-semibold" colSpan={3}>{sitePOs.reduce((s2, p) => s2 + (p.unitCost != null ? p.unitCost * p.qty : 0), 0).toFixed(2)}</td></tr></tfoot>
                      )}
                    </table>
                  </div>
                  {canEdit && (
                    <div className="flex flex-wrap items-center gap-2 rounded-md p-3" style={{ background: C.card, border: `1px solid ${C.border}` }}>
                      <input value={poForm.poNumber} onChange={(e) => setPoForm({ ...poForm, poNumber: e.target.value })} placeholder="PO number" className="w-28 rounded px-2.5 py-1.5 text-sm" style={{ border: `1px solid ${C.border}` }} />
                      <input type="date" value={poForm.date} onChange={(e) => setPoForm({ ...poForm, date: e.target.value })} className="w-36 rounded px-2.5 py-1.5 text-sm" style={{ border: `1px solid ${C.border}` }} />
                      <input value={poForm.vendor} onChange={(e) => setPoForm({ ...poForm, vendor: e.target.value })} placeholder="Vendor (optional)" className="w-32 rounded px-2.5 py-1.5 text-sm" style={{ border: `1px solid ${C.border}` }} />
                      <input value={poForm.item} onChange={(e) => setPoForm({ ...poForm, item: e.target.value })} placeholder="Item purchased" className="flex-1 min-w-[140px] rounded px-2.5 py-1.5 text-sm" style={{ border: `1px solid ${C.border}` }} />
                      <input type="number" min={1} value={poForm.qty} onChange={(e) => setPoForm({ ...poForm, qty: e.target.value })} className="w-16 rounded px-2.5 py-1.5 text-sm" style={{ border: `1px solid ${C.border}` }} title="Quantity" />
                      <input type="number" min={0} step="0.01" value={poForm.unitCost} onChange={(e) => setPoForm({ ...poForm, unitCost: e.target.value })} placeholder="Unit cost" className="w-24 rounded px-2.5 py-1.5 text-sm" style={{ border: `1px solid ${C.border}` }} />
                      <input value={poForm.note} onChange={(e) => setPoForm({ ...poForm, note: e.target.value })} placeholder="Note (optional)" className="flex-1 min-w-[120px] rounded px-2.5 py-1.5 text-sm" style={{ border: `1px solid ${C.border}` }} />
                      <button onClick={() => addPO(s.key)} className="flex items-center gap-1 rounded px-2.5 py-1.5 text-xs font-medium text-white" style={{ background: C.primary }}><Plus className="h-3.5 w-3.5" /> Add</button>
                    </div>
                  )}
                </div>
              )}

              {siteView === "report" && (
                <div className="space-y-6">
                  <div className="flex items-center justify-between print:hidden">
                    <p className="text-xs" style={{ color: C.sub }}>A clean printable sheet for {s.label} — desk setup and user setup, side by side for manual verification.</p>
                    <button onClick={() => window.print()} className="flex items-center gap-1.5 rounded px-2.5 py-1.5 text-xs font-medium text-white" style={{ background: C.primary }}><Printer className="h-3.5 w-3.5" /> Print / Save PDF</button>
                  </div>

                  <div>
                    <h3 className="mb-2 text-sm font-semibold">{s.label} — Desk setup</h3>
                    <table className="w-full text-xs" style={{ border: `1px solid ${C.border}` }}>
                      <thead><tr style={{ background: C.grid }}><th className="border px-2 py-1 text-left" style={{ borderColor: C.border }}>Desk #</th><th className="border px-2 py-1 text-left" style={{ borderColor: C.border }}>User</th><th className="border px-2 py-1 text-left" style={{ borderColor: C.border }}>Status</th><th className="border px-2 py-1 text-left" style={{ borderColor: C.border }}>Monitors</th><th className="border px-2 py-1 text-left" style={{ borderColor: C.border }}>Dock</th><th className="border px-2 py-1 text-left" style={{ borderColor: C.border }}>Keyboard</th></tr></thead>
                      <tbody>
                        {[...siteDesks].sort((a, b) => a.number - b.number).map((d) => (
                          <tr key={d.id}>
                            <td className="border px-2 py-1" style={{ borderColor: C.border }}>{d.number}</td>
                            <td className="border px-2 py-1" style={{ borderColor: C.border }}>{d.user || "—"}</td>
                            <td className="border px-2 py-1" style={{ borderColor: C.border }}>{SEAT[d.status].label}</td>
                            <td className="border px-2 py-1" style={{ borderColor: C.border }}>{d.equipment.monitors}</td>
                            <td className="border px-2 py-1" style={{ borderColor: C.border }}>{d.equipment.dock ? (d.equipment.dockModel || "Yes") : "—"}</td>
                            <td className="border px-2 py-1" style={{ borderColor: C.border }}>{d.equipment.keyboard ? (d.equipment.keyboardModel || "Yes") : "—"}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>

                  <div style={{ breakBefore: "page" }}>
                    <h3 className="mb-2 text-sm font-semibold">{s.label} — User setup</h3>
                    <table className="w-full text-xs" style={{ border: `1px solid ${C.border}` }}>
                      <thead><tr style={{ background: C.grid }}><th className="border px-2 py-1 text-left" style={{ borderColor: C.border }}>User</th><th className="border px-2 py-1 text-left" style={{ borderColor: C.border }}>Desk #</th><th className="border px-2 py-1 text-left" style={{ borderColor: C.border }}>Mouse</th><th className="border px-2 py-1 text-left" style={{ borderColor: C.border }}>Headset</th>{s.key === "dubai" && <th className="border px-2 py-1 text-left" style={{ borderColor: C.border }}>Laptop</th>}</tr></thead>
                      <tbody>
                        {siteDesks.filter((d) => d.user).length === 0 && <tr><td colSpan={5} className="border px-2 py-3 text-center" style={{ borderColor: C.border, color: C.sub }}>No desks assigned to a user yet.</td></tr>}
                        {[...siteDesks].filter((d) => d.user).sort((a, b) => a.user.localeCompare(b.user)).map((d) => (
                          <tr key={d.id}>
                            <td className="border px-2 py-1 font-medium" style={{ borderColor: C.border }}>{d.user}</td>
                            <td className="border px-2 py-1" style={{ borderColor: C.border }}>{d.number}</td>
                            <td className="border px-2 py-1" style={{ borderColor: C.border }}>{d.equipment.mouse ? (d.equipment.mouseModel || "Yes") : "—"}</td>
                            <td className="border px-2 py-1" style={{ borderColor: C.border }}>{d.equipment.headset ? (d.equipment.headsetModel || "Yes") : "—"}</td>
                            {s.key === "dubai" && <td className="border px-2 py-1" style={{ borderColor: C.border }}>{d.equipment.laptop ? (d.equipment.laptopModel || "Yes") : "—"}</td>}
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}
            </div>
          );
        })}

        {selected && (
          <div className="fixed inset-0 z-40 flex items-center justify-center p-4 print:hidden" style={{ background: "rgba(0,0,0,0.3)" }} onClick={() => setSelected(null)}>
            <div className="w-full max-w-sm rounded-md p-5 shadow-xl" style={{ background: C.card }} onClick={(e) => e.stopPropagation()}>
              <div className="mb-3 flex items-center justify-between"><span className="text-sm font-semibold">Desk #{selected.number} <span style={{ color: C.sub, fontWeight: 400 }}>({selected.id})</span></span><button onClick={() => setSelected(null)} style={{ color: C.sub }}>✕</button></div>
              {!canEdit && <p className="mb-3 rounded px-2.5 py-1.5 text-[11px]" style={{ background: C.grid, color: C.sub }}>Read-only mode — switch to Admin to edit.</p>}
              <label className="mb-1 block text-xs font-medium" style={{ color: C.sub }}>Assigned user</label>
              <input disabled={!canEdit} defaultValue={selected.user ?? ""} placeholder="Unassigned" list="known-user-names" className="mb-3 w-full rounded px-2.5 py-1.5 text-sm" style={{ border: `1px solid ${C.border}` }} onBlur={(e) => {
                const v = e.target.value || null;
                if (v !== selected.user) {
                  updateDesk(selected.id, {
                    user: v,
                    equipment: { ...selected.equipment, laptop: false, laptopModel: "", headset: false, headsetModel: "", mouse: false, mouseModel: "" },
                  }, v ? `Assigned to ${v} (personal gear cleared)` : "Unassigned (personal gear cleared)");
                }
              }} />
              <datalist id="known-user-names">{knownUserNames.map((n) => <option key={n} value={n} />)}</datalist>
              <label className="mb-1 block text-xs font-medium" style={{ color: C.sub }}>Status</label>
              <select disabled={!canEdit} value={selected.status} className="mb-3 w-full rounded px-2.5 py-1.5 text-sm" style={{ border: `1px solid ${C.border}` }} onChange={(e) => updateDesk(selected.id, { status: e.target.value }, `Status → ${SEAT[e.target.value].label}`)}>
                {Object.entries(SEAT).map(([k, st]) => <option key={k} value={k}>{st.label}</option>)}
              </select>

              <label className="mb-1 block text-xs font-medium" style={{ color: C.sub }}>Desk gear <span className="font-normal" style={{ color: C.sub }}>— stays with the desk</span></label>
              <div className="mb-3 space-y-1.5">
                <div className="flex items-center gap-2 rounded px-2.5 py-1.5 text-xs" style={{ border: `1px solid ${C.border}` }}>
                  <Monitor className="h-3.5 w-3.5 shrink-0" style={{ color: C.sub }} />
                  <select disabled={!canEdit} value={selected.equipment.monitors} className="bg-transparent outline-none" onChange={(e) => { const m = Number(e.target.value); const p = { equipment: { ...selected.equipment, monitors: m } }; if (m === 0) p.status = "unavailable"; updateDesk(selected.id, p, `Monitors → ${m}`); }}>
                    {[0, 1, 2, 3].map((n) => <option key={n} value={n}>{n} monitor{n !== 1 ? "s" : ""}</option>)}
                  </select>
                </div>
                <EquipRow icon={HardDrive} label="Dock" disabled={!canEdit} checked={selected.equipment.dock} model={selected.equipment.dockModel} onToggle={(v) => updateDesk(selected.id, { equipment: { ...selected.equipment, dock: v } }, `Dock ${v ? "added" : "removed"}`)} onModel={(v) => updateDesk(selected.id, { equipment: { ...selected.equipment, dockModel: v } })} />
                <EquipRow icon={Keyboard} label="Keyboard" disabled={!canEdit} checked={selected.equipment.keyboard} model={selected.equipment.keyboardModel} onToggle={(v) => updateDesk(selected.id, { equipment: { ...selected.equipment, keyboard: v } }, `Keyboard ${v ? "added" : "removed"}`)} onModel={(v) => updateDesk(selected.id, { equipment: { ...selected.equipment, keyboardModel: v } })} />
              </div>

              <label className="mb-1 block text-xs font-medium" style={{ color: C.sub }}>Personal gear <span className="font-normal" style={{ color: C.sub }}>— goes with the person, cleared when reassigned</span></label>
              <div className="mb-3 space-y-1.5">
                <EquipRow icon={Mouse} label="Mouse" disabled={!canEdit} checked={selected.equipment.mouse} model={selected.equipment.mouseModel} onToggle={(v) => updateDesk(selected.id, { equipment: { ...selected.equipment, mouse: v } }, `Mouse ${v ? "added" : "removed"}`)} onModel={(v) => updateDesk(selected.id, { equipment: { ...selected.equipment, mouseModel: v } })} />
                <EquipRow icon={Headphones} label="Headset" disabled={!canEdit} checked={selected.equipment.headset} model={selected.equipment.headsetModel} onToggle={(v) => updateDesk(selected.id, { equipment: { ...selected.equipment, headset: v } }, `Headset ${v ? "added" : "removed"}`)} onModel={(v) => updateDesk(selected.id, { equipment: { ...selected.equipment, headsetModel: v } })} />
                {selected.site === "dubai" && <EquipRow icon={Laptop} label="Laptop" disabled={!canEdit} checked={selected.equipment.laptop} model={selected.equipment.laptopModel} onToggle={(v) => updateDesk(selected.id, { equipment: { ...selected.equipment, laptop: v } }, `Laptop ${v ? "added" : "removed"}`)} onModel={(v) => updateDesk(selected.id, { equipment: { ...selected.equipment, laptopModel: v } })} />}
              </div>
              <div className="mt-4 pt-3" style={{ borderTop: `1px solid ${C.border}` }}>
                <div className="mb-1.5 flex items-center gap-1.5 text-xs font-medium" style={{ color: C.sub }}><History className="h-3.5 w-3.5" /> Recent activity</div>
                <ul className="space-y-1 text-[11px]" style={{ color: C.sub }}>{selected.history.slice(0, 4).map((h, i) => <li key={i} className="flex justify-between gap-2"><span>{h.action}</span><span className="shrink-0">{new Date(h.ts).toLocaleDateString()}</span></li>)}</ul>
              </div>
            </div>
          </div>
        )}

        {loginOpen && (
          <div className="fixed inset-0 z-40 flex items-center justify-center p-4 print:hidden" style={{ background: "rgba(0,0,0,0.3)" }} onClick={() => setLoginOpen(false)}>
            <div className="w-full max-w-xs rounded-md p-5 shadow-xl" style={{ background: C.card }} onClick={(e) => e.stopPropagation()}>
              <div className="mb-3 flex items-center justify-between"><span className="text-sm font-semibold">Admin log in</span><button onClick={() => setLoginOpen(false)} style={{ color: C.sub }}>✕</button></div>
              <label className="mb-1 block text-xs font-medium" style={{ color: C.sub }}>Admin password</label>
              <input type="password" autoFocus value={loginPassword} onChange={(e) => setLoginPassword(e.target.value)} onKeyDown={(e) => e.key === "Enter" && handleLogin()} className="mb-3 w-full rounded px-2.5 py-1.5 text-sm" style={{ border: `1px solid ${C.border}` }} />
              {loginError && <p className="mb-3 text-xs" style={{ color: SEAT.occupied.color }}>{loginError}</p>}
              <div className="flex justify-end gap-2">
                <button onClick={() => setLoginOpen(false)} className="rounded px-2.5 py-1.5 text-xs font-medium" style={{ border: `1px solid ${C.border}` }}>Cancel</button>
                <button onClick={handleLogin} className="rounded px-2.5 py-1.5 text-xs font-medium text-white" style={{ background: C.primary }}>Log in</button>
              </div>
            </div>
          </div>
        )}

        {zoneEdit && (
          <div className="fixed inset-0 z-40 flex items-center justify-center p-4 print:hidden" style={{ background: "rgba(0,0,0,0.3)" }} onClick={() => setZoneEdit(null)}>
            <div className="w-full max-w-xs rounded-md p-5 shadow-xl" style={{ background: C.card }} onClick={(e) => e.stopPropagation()}>
              <div className="mb-3 flex items-center justify-between"><span className="text-sm font-semibold">Edit space</span><button onClick={() => setZoneEdit(null)} style={{ color: C.sub }}>✕</button></div>
              <label className="mb-1 block text-xs font-medium" style={{ color: C.sub }}>Label</label>
              <input value={zoneEdit.label} onChange={(e) => setZoneEdit({ ...zoneEdit, label: e.target.value })} className="mb-3 w-full rounded px-2.5 py-1.5 text-sm" style={{ border: `1px solid ${C.border}` }} />
              <label className="mb-1 block text-xs font-medium" style={{ color: C.sub }}>Type</label>
              <select value={zoneEdit.type} onChange={(e) => setZoneEdit({ ...zoneEdit, type: e.target.value })} className="mb-1 w-full rounded px-2.5 py-1.5 text-sm" style={{ border: `1px solid ${C.border}` }}>
                {Object.entries(ZONE_TYPES).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
              </select>
              <p className="mb-3 text-[11px]" style={{ color: C.sub }}>Pick "Other" and rename the label for anything custom — the color just stays neutral gray.</p>
              <div className="flex justify-end gap-2">
                <button onClick={() => setZoneEdit(null)} className="rounded px-2.5 py-1.5 text-xs font-medium" style={{ border: `1px solid ${C.border}` }}>Cancel</button>
                <button onClick={() => { saveZoneEdit(zoneEdit.site, zoneEdit.id, { label: zoneEdit.label.trim() || "Space", type: zoneEdit.type }); setZoneEdit(null); }} className="rounded px-2.5 py-1.5 text-xs font-medium text-white" style={{ background: C.primary }}>Save</button>
              </div>
            </div>
          </div>
        )}

        {manageOpen && (
          <div className="fixed inset-0 z-40 flex items-center justify-center p-4 print:hidden" style={{ background: "rgba(0,0,0,0.3)" }} onClick={() => setManageOpen(false)}>
            <div className="w-full max-w-lg rounded-md p-5 shadow-xl" style={{ background: C.card }} onClick={(e) => e.stopPropagation()}>
              <div className="mb-3 flex items-center justify-between"><span className="text-sm font-semibold">Manage Sites</span><button onClick={() => setManageOpen(false)} style={{ color: C.sub }}>✕</button></div>
              <div className="max-h-72 space-y-2 overflow-auto">
                {sites.map((s) => {
                  const sum = siteSummary(desks.filter((d) => d.site === s.key));
                  const assetCount = (assets[s.key] || []).reduce((sum2, a) => sum2 + a.qty, 0);
                  return (
                    <div key={s.key} className="rounded px-2.5 py-2 text-sm" style={{ border: `1px solid ${C.border}`, opacity: s.hidden ? 0.55 : 1 }}>
                      <div className="flex items-center justify-between gap-2">
                        <span className="font-medium">{s.label}{s.hidden && <span className="ml-1.5 text-[10px] font-normal" style={{ color: C.sub }}>(hidden)</span>}</span>
                        <div className="flex items-center gap-2">
                          <input type="number" min={0} defaultValue={s.deskCount} className="w-16 rounded px-1.5 py-1 text-xs" style={{ border: `1px solid ${C.border}` }} onBlur={(e) => updateSiteCount(s.key, Math.max(0, Number(e.target.value) || 0))} />
                          <button onClick={() => toggleSiteHidden(s.key)} title={s.hidden ? "Show this site" : "Hide this site"}>{s.hidden ? <Eye className="h-3.5 w-3.5" style={{ color: C.sub }} /> : <EyeOff className="h-3.5 w-3.5" style={{ color: C.sub }} />}</button>
                          <button onClick={() => removeSite(s.key)}><Trash2 className="h-3.5 w-3.5" style={{ color: SEAT.occupied.color }} /></button>
                        </div>
                      </div>
                      <p className="mt-1 text-[11px]" style={{ color: C.sub }}>{sum.occupied} occupied · {sum.available} available · {(zones[s.key] || []).length} spaces · {assetCount} logged assets</p>
                      {s.key === "dubai" && (
                        <button onClick={resetDubaiToFloorPlan} className="mt-1.5 rounded px-2 py-1 text-[11px] font-medium" style={{ border: `1px solid ${C.border}`, color: C.primary }}>Reset to traced floor plan</button>
                      )}
                    </div>
                  );
                })}
              </div>
              <div className="mt-3 flex items-center gap-2 border-t pt-3" style={{ borderColor: C.border }}>
                <input value={newSiteLabel} onChange={(e) => setNewSiteLabel(e.target.value)} placeholder="New site name" className="flex-1 rounded px-2.5 py-1.5 text-sm" style={{ border: `1px solid ${C.border}` }} />
                <input type="number" min={0} value={newSiteCount} onChange={(e) => setNewSiteCount(e.target.value)} className="w-16 rounded px-1.5 py-1.5 text-sm" style={{ border: `1px solid ${C.border}` }} />
                <button onClick={addSite} className="rounded px-2.5 py-1.5 text-sm text-white" style={{ background: C.primary }}><Plus className="h-3.5 w-3.5" /></button>
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function AddCustomItem({ onAdd }) {
  const [name, setName] = useState("");
  return (
    <div className="flex items-center gap-2 rounded-md p-3" style={{ background: C.card, border: `1px solid ${C.border}` }}>
      <input value={name} onChange={(e) => setName(e.target.value)} placeholder="Add a custom stock item (e.g. Webcam)" className="flex-1 rounded px-2.5 py-1.5 text-sm" style={{ border: `1px solid ${C.border}` }} />
      <button onClick={() => { onAdd(name); setName(""); }} className="flex items-center gap-1 rounded px-2.5 py-1.5 text-xs font-medium text-white" style={{ background: C.primary }}><Plus className="h-3.5 w-3.5" /> Add</button>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<DeskDashboard />);
</script>
</body>
</html>
